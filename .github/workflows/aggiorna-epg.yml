name: Aggiorna EPG DiegoTV

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *' # Ogni giorno alle 04:17 UTC

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4
      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unisci le guide
        run: python scripts/crea_epg.py --playlist DiegoTV.m3u --output docs/epg.xml.gz --report docs/report.csv
      - name: Pubblica la guida aggiornata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/epg.xml.gz docs/report.csv
          if git diff --cached --quiet; then
            echo "Nessuna modifica"
          else
            git commit -m "Aggiorna EPG DiegoTV"
            git push
          fi
